    needs: [generate-fixture, build-spinel]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
