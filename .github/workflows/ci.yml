name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MASTODON_SHA: 163f96cee4dea23365bff9b433871e68d20d9ee7
  RUBY_BENCH_SHA: d771f81f1ce9db51376e03ca7b8e6a83160556d4
  CAMPFIRE_SHA: 90b330024dec3e757c79b6a7e6568f93da8e3148

jobs:
  generate-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Install Rails
        run: gem install rails
      - name: Generate fixtures/real-blog
        run: bin/rh fixture
      - name: Generate fixtures/store by following the guide
        run: cd fixtures && ../scripts/create-store store
      - name: Pack fixtures
        run: |
          tar --exclude='./fixtures/real-blog/tmp' \
              --exclude='./fixtures/real-blog/log' \
              --exclude='./fixtures/store/tmp' \
              --exclude='./fixtures/store/log' \
              --exclude='./fixtures/store/storage' \
              -czf real-blog.tar.gz fixtures/real-blog fixtures/store
      - name: Upload fixture
        uses: actions/upload-artifact@v7
        with:
          name: real-blog-fixture
          path: real-blog.tar.gz
          retention-days: 1

  store-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Install Rails
        run: gem install rails
      - name: Build the store by following the guide (runs its tests)
        run: cd fixtures && ../scripts/create-store store
      - name: cargo build
        run: cargo build --release --bin roundhouse
      - name: The analyzer reports no errors, no warnings and no ingest gaps on the store
        run: |
          set -euo pipefail
          target/release/roundhouse check --continue fixtures/store 2>&1 | tee /tmp/store-check.txt
          grep -E "^roundhouse-check: .* 0 error\(s\), 0 warning\(s\), 0 gap-attributed note\(s\), 0 survey gap\(s\)" /tmp/store-check.txt

  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WASI_SDK_VERSION: "33.0"
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - name: Install libclang (host bindgen)
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-apt-install" libclang-dev
      - name: Cache WASI SDK
        id: wasi-sdk
        uses: actions/cache@v4
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux
      - name: Install WASI SDK
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          ver="${WASI_SDK_VERSION}"; major="${ver%%.*}"
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${major}/wasi-sdk-${ver}-x86_64-linux.tar.gz"
          curl -fsSL "$url" -o /tmp/wasi-sdk.tar.gz
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
      - name: Build roundhouse_wasm.wasm
        env:
          WASI_SDK_PATH: /opt/wasi-sdk
          ROUNDHOUSE_COMMIT: ${{ github.sha }}
        run: cargo build --release --target wasm32-wasip1 --manifest-path wasm/Cargo.toml
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v7
        with:
          name: roundhouse-wasm
          path: wasm/target/wasm32-wasip1/release/roundhouse_wasm.wasm
          retention-days: 1

  build-spinel:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone matz/spinel master
        run: git clone --depth 1 --branch master https://github.com/matz/spinel.git spinel-src
      - name: make deps (fetch vendored libprism)
        run: make -C spinel-src deps
      - name: make all
        run: make -C spinel-src all
      - name: Stage artifact tree
        run: |
          mkdir spinel-dist
          cp -L spinel-src/spinel               spinel-dist/spinel
          cp    spinel-src/bin/spin             spinel-dist/spin
          cp    spinel-src/build/spinel_rbs_extract spinel-dist/
          cp -R spinel-src/lib                  spinel-dist/lib
          cp -R spinel-src/packages             spinel-dist/packages
          cp -R spinel-src/builtins             spinel-dist/builtins
      - name: Upload spinel toolchain
        uses: actions/upload-artifact@v7
        with:
          name: spinel-dist
          path: spinel-dist
          retention-days: 1

  unit:
    needs: generate-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: real-blog-fixture
      - name: Extract fixture
        run: tar -xzf real-blog.tar.gz
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install the gem the overlay escape surface uses
        run: gem install rails-html-sanitizer --no-document
      - name: Install the gem the emitted Ruby tree runs on
        run: gem install sqlite3 --no-document
      - name: cargo test
        run: cargo test --all-targets
      - name: Emit every bench lane in the debug profile (scripts/bench's shape)
        run: |
          set -euo pipefail
          for target in typescript crystal rust python elixir go kotlin swift csharp; do
            cargo run --quiet --bin emit_preview -- --target "$target" fixtures/real-blog >/dev/null
          done

  toolchain-crystal:
    needs: generate-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: real-blog-fixture
      - name: Extract fixture
        run: tar -xzf real-blog.tar.gz
      - name: Refresh apt index
        run: sudo apt-get update -qq
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: cargo test --test crystal_toolchain -- --ignored
        run: cargo test --test crystal_toolchain -- --ignored --nocapture

  framework-tests-swift:
    needs: generate-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'
      - name: Install libsqlite3-dev (CSQLite systemLibrary)
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-apt-install" libsqlite3-dev
      - name: cargo test --test framework_tests_swift
        run: cargo test --test framework_tests_swift -- --ignored --nocapture

  toolchain-typescript:
    needs: generate-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: real-blog-fixture
      - name: Extract fixture
        run: tar -xzf real-blog.tar.gz
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: cargo test --test typescript_toolchain real_blog -- --ignored
        run: cargo test --test typescript_toolchain real_blog -- --ignored --nocapture

  framework-tests-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: cargo test --test framework_tests_typescript -- --ignored
        run: cargo test --test framework_tests_typescript -- --ignored --nocapture

  browser-smoke-typescript:
    needs: generate-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: real-blog-fixture
      - name: Extract fixture
        run: tar -xzf real-blog.tar.gz
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install harness deps
        run: npm ci
        working-directory: tests/browser_smoke
      - name: Install Playwright Chromium (+ system deps)
        run: $GITHUB_WORKSPACE/scripts/ci-playwright-install
        working-directory: tests/browser_smoke
      - name: Run SharedWorker browser smoke (emit → vite build → drive)
        run: npm test
        working-directory: tests/browser_smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-playwright-report
          path: |
            tests/browser_smoke/playwright-report
            tests/browser_smoke/test-results
          retention-days: 7
          if-no-files-found: ignore

  browser-smoke-ide:
    needs: [build-wasm, generate-fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: roundhouse-wasm
          path: wasm/lib
      - uses: actions/download-artifact@v8
        with:
          name: real-blog-fixture
      - name: Extract fixture
        run: tar -xzf real-blog.tar.gz
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Cache Mastodon source bundle
        id: mastodon-src
        uses: actions/cache@v4
        with:
          path: wasm/ide/app-src.json
          key: mastodon-app-src-${{ env.MASTODON_SHA }}-v2
      - name: Fetch pinned Mastodon + bundle sources
        if: steps.mastodon-src.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://codeload.github.com/mastodon/mastodon/tar.gz/${MASTODON_SHA}" -o /tmp/mastodon.tar.gz
          mkdir -p /tmp/mastodon && tar -xzf /tmp/mastodon.tar.gz -C /tmp/mastodon --strip-components=1
          node wasm/ide/bundle-src.mjs /tmp/mastodon wasm/ide/app-src.json \
            --name mastodon --commit "${MASTODON_SHA}" \
            --open app/controllers/statuses_controller.rb
      - name: Cache lobsters source bundle
        id: lobsters-src
        uses: actions/cache@v4
        with:
          path: /tmp/app-lobsters.json
          key: lobsters-app-src-${{ env.RUBY_BENCH_SHA }}-v1
      - name: Fetch pinned ruby-bench + bundle lobsters (cache miss)
        if: steps.lobsters-src.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://codeload.github.com/ruby/ruby-bench/tar.gz/${RUBY_BENCH_SHA}" -o /tmp/ruby-bench.tar.gz
          mkdir -p /tmp/lobsters
          tar -xzf /tmp/ruby-bench.tar.gz -C /tmp/lobsters --strip-components=3 "ruby-bench-${RUBY_BENCH_SHA}/benchmarks/lobsters"
          node wasm/ide/bundle-src.mjs /tmp/lobsters /tmp/app-lobsters.json \
            --name lobsters --commit "${RUBY_BENCH_SHA}" \
            --open app/controllers/stories_controller.rb
      - name: Cache campfire source bundle
        id: campfire-src
        uses: actions/cache@v4
        with:
          path: /tmp/app-campfire.json
          key: campfire-app-src-${{ env.CAMPFIRE_SHA }}-v1
      - name: Fetch pinned once-campfire + bundle sources (cache miss)
        if: steps.campfire-src.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://codeload.github.com/basecamp/once-campfire/tar.gz/${CAMPFIRE_SHA}" -o /tmp/campfire.tar.gz
          mkdir -p /tmp/campfire && tar -xzf /tmp/campfire.tar.gz -C /tmp/campfire --strip-components=1
          node wasm/ide/bundle-src.mjs /tmp/campfire /tmp/app-campfire.json \
            --name campfire --commit "${CAMPFIRE_SHA}" \
            --open app/models/message.rb
      - name: Assemble picker bundles + manifest
        run: |
          set -euo pipefail
          node wasm/ide/bundle-src.mjs fixtures/real-blog wasm/ide/app-blog.json \
            --name blog --open app/controllers/articles_controller.rb
          node wasm/ide/bundle-src.mjs fixtures/store wasm/ide/app-store.json \
            --name store --open app/views/products/index.html.erb
          node wasm/ide/bundle-src.mjs fixtures/roda-blog wasm/lib/app-roda.json \
            --name roda-blog --open app.rb
          cp /tmp/app-lobsters.json wasm/ide/app-lobsters.json
          cp /tmp/app-campfire.json wasm/ide/app-campfire.json
          printf '%s\n' '{"default":"store","apps":[{"name":"store","label":"Rails Guides store","src":"app-store.json"},{"name":"blog","label":"Rails blog","src":"app-blog.json"},{"name":"lobsters","label":"Lobsters","src":"app-lobsters.json"},{"name":"campfire","label":"Campfire","src":"app-campfire.json"},{"name":"mastodon","label":"Mastodon","src":"app-src.json"}]}' > wasm/ide/apps.json
          # Playground picker (lib/): lobsters + mastodon alongside the committed
          # blog fixture, so verify-playground exercises the app switch + the
          # off-thread Mastodon transpile.
          cp /tmp/app-lobsters.json wasm/lib/app-lobsters.json
          cp /tmp/app-campfire.json wasm/lib/app-campfire.json
          cp wasm/ide/app-src.json  wasm/lib/app-mastodon.json
          printf '%s\n' '{"default":"blog","apps":[{"name":"blog","label":"Rails blog","src":"fixture.json","open":"app/models/article.rb"},{"name":"roda","label":"Roda + Sequel blog","src":"app-roda.json","open":"app.rb"},{"name":"lobsters","label":"Lobsters","src":"app-lobsters.json","open":"app/models/story.rb"},{"name":"campfire","label":"Campfire","src":"app-campfire.json","open":"app/models/message.rb"},{"name":"mastodon","label":"Mastodon","src":"app-mastodon.json","open":"app/models/status.rb"}]}' > wasm/lib/apps.json
      - name: Install harness deps (Playwright)
        run: npm ci
        working-directory: tests/browser_smoke
      - name: Install Playwright Chromium (+ system deps)
        run: $GITHUB_WORKSPACE/scripts/ci-playwright-install
        working-directory: tests/browser_smoke
      - name: Serve wasm/ and verify the /ide/ + /playground/ + /studio/ pages
        run: |
          set -euo pipefail
          (cd wasm && python3 -m http.server 8099 >/tmp/ide-server.log 2>&1 &)
          sleep 1
          (cd wasm/ide && node verify-ide.mjs)
          # Same shared worker/client, exercised through the emit surface incl.
          # the off-thread Mastodon transpile.
          (cd wasm/playground && node verify-playground.mjs)
          # Studio: runs the emitted blog + its Minitest suite in-browser over
          # wasm/lib/test-runtime.mjs — the in-memory Db shim that once drifted
          # off the `_opt` seam unseen because nothing here ran it.
          (cd wasm/studio && node verify-studio.mjs)

  framework-tests-crystal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Refresh apt index
        run: sudo apt-get update -qq
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: cargo test --test framework_tests_crystal -- --ignored
        run: cargo test --test framework_tests_crystal -- --ignored --nocapture

  framework-tests-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: cargo test --test framework_tests_kotlin
        run: cargo test --test framework_tests_kotlin -- --ignored --nocapture

  framework-tests-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --test framework_tests_rust (green subset)
        run: cargo test --test framework_tests_rust -- --ignored --nocapture inflector

  framework-tests-ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ./runtime/spinel/scaffold
      - name: cargo test --test framework_tests_ruby -- --ignored
        run: cargo test --test framework_tests_ruby -- --ignored --nocapture
      - name: cargo test --test uuid_key_ruby -- --ignored
        run: cargo test --test uuid_key_ruby -- --ignored --nocapture

  framework-tests-spinel:
    needs: build-spinel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: spinel-dist
          path: spinel-dist
      - name: Stage spinel binaries
        run: |
          chmod +x spinel-dist/spinel spinel-dist/spin spinel-dist/spinel_rbs_extract
          echo "$PWD/spinel-dist" >> $GITHUB_PATH
      - name: cargo test --test framework_tests_spinel -- --ignored
        run: cargo test --test framework_tests_spinel -- --ignored --nocapture
      - name: cargo test --test spinel_web_push_crypto -- --ignored
        if: always()
        run: cargo test --test spinel_web_push_crypto -- --ignored --nocapture
      - name: cargo test --test spinel_db_lease -- --ignored
        if: always()
        run: cargo test --test spinel_db_lease -- --ignored --nocapture
      - name: cargo test --test spinel_param_builder -- --ignored
        if: always()
        run: cargo test --test spinel_param_builder -- --ignored --nocapture
      - name: cargo test --test rails_compat_vectors_spinel -- --ignored
        if: always()
        run: cargo test --test rails_compat_vectors_spinel -- --ignored --nocapture

  campfire-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis
        ports: ['6379:6379']
    env:
      BUNDLE_PATH: vendor/bundle
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Fetch pinned once-campfire
        run: |
          curl -fsSL "https://codeload.github.com/basecamp/once-campfire/tar.gz/${CAMPFIRE_SHA}" -o /tmp/campfire.tar.gz
          mkdir -p /tmp/campfire && tar -xzf /tmp/campfire.tar.gz -C /tmp/campfire --strip-components=1
      - name: System libvips
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvips-dev sqlite3
      - name: Cache the prepared oracle
        id: oracle
        uses: actions/cache@v4
        with:
          path: build/campfire-oracle
          key: campfire-oracle-${{ env.CAMPFIRE_SHA }}-ruby34-v1
      - name: Prepare the Rails oracle (cache miss)
        if: steps.oracle.outputs.cache-hit != 'true'
        run: scripts/campfire-oracle prepare --app /tmp/campfire
      - name: Emit-lane + walk gems
        run: gem install puma nio4r websocket-driver rack sqlite3 bcrypt ruby-vips concurrent-ruby net-http-persistent web-push rails-html-sanitizer --no-document
      - name: scripts/campfire-compare
        run: scripts/campfire-compare /tmp/campfire
      - name: scripts/campfire-db-differential
        run: scripts/campfire-db-differential /tmp/campfire

  campfire-compare-spinel:
    name: campfire-compare-spinel (${{ matrix.gc }})
    needs: build-spinel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - gc: default
            flag: ''
          - gc: minor-gc
            flag: --minor-gc
          - gc: verify-gen
            flag: --verify-gen
    services:
      redis:
        image: redis
        ports: ['6379:6379']
    env:
      BUNDLE_PATH: vendor/bundle
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: actions/download-artifact@v8
        with:
          name: spinel-dist
          path: spinel-dist
      - name: Stage spinel binaries
        run: |
          chmod +x spinel-dist/spinel spinel-dist/spin spinel-dist/spinel_rbs_extract
          echo "$PWD/spinel-dist" >> $GITHUB_PATH
      - name: System libvips + libsqlite3-dev + libjemalloc-dev
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvips-dev libsqlite3-dev libjemalloc-dev sqlite3
      - name: Fetch pinned once-campfire
        run: |
          curl -fsSL "https://codeload.github.com/basecamp/once-campfire/tar.gz/${CAMPFIRE_SHA}" -o /tmp/campfire.tar.gz
          mkdir -p /tmp/campfire && tar -xzf /tmp/campfire.tar.gz -C /tmp/campfire --strip-components=1
      - name: Cache the prepared oracle
        id: oracle
        uses: actions/cache@v4
        with:
          path: build/campfire-oracle
          key: campfire-oracle-${{ env.CAMPFIRE_SHA }}-ruby34-v1
      - name: Prepare the Rails oracle (cache miss)
        if: steps.oracle.outputs.cache-hit != 'true'
        run: scripts/campfire-oracle prepare --app /tmp/campfire
      - name: Walk gems
        run: gem install websocket-driver --no-document
      - name: scripts/campfire-compare --spinel ${{ matrix.flag }}
        run: scripts/campfire-compare --spinel ${{ matrix.flag }} /tmp/campfire
      - name: scripts/campfire-db-differential --spinel
        if: matrix.gc == 'default'
        run: scripts/campfire-db-differential --spinel /tmp/campfire

  campfire-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install packages the Buildkite hosted image lacks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev libyaml-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install libvips (ruby-vips binds it through FFI) and ffmpeg
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-apt-install" libvips-dev ffmpeg
      - name: Install the gems the emitted suite loads
        run: gem install sqlite3 bcrypt nokogiri webmock mocha rqrcode ruby-vips sentry-ruby platform_agent concurrent-ruby net-http-persistent web-push rails-html-sanitizer --no-document
      - name: Fetch once-campfire at the pinned SHA
        run: |
          set -euo pipefail
          curl -fsSL "https://codeload.github.com/basecamp/once-campfire/tar.gz/${CAMPFIRE_SHA}" -o /tmp/campfire.tar.gz
          mkdir -p /tmp/campfire
          tar -xzf /tmp/campfire.tar.gz -C /tmp/campfire --strip-components=1
      - name: Enforce the strict-emit ceiling
        env:
          CEILING_ERRORS: 0
        run: |
          set -uo pipefail
          cargo run --quiet --bin roundhouse -- \
            --target spinel /tmp/campfire -o /tmp/campfire-spinel \
            > /tmp/campfire-strict.log 2>&1
          errors=$(grep -c 'error\[' /tmp/campfire-strict.log || true)
          echo "campfire strict emit (spinel, no --allow-unsupported): $errors errors"
          echo "ceiling: $CEILING_ERRORS"
          grep 'error\[' /tmp/campfire-strict.log || true
          if [ "$errors" -gt "$CEILING_ERRORS" ]; then
            echo "::error::campfire strict emit regressed: $errors > $CEILING_ERRORS (each line above is a modelling gap, not app breakage)"
            exit 1
          fi
          if [ "$errors" -lt "$CEILING_ERRORS" ]; then
            echo "::notice::ceiling is stale — lower CEILING_ERRORS to $errors"
          fi
      - name: Run campfire's suite against the emit
        run: |
          scripts/campfire-suite \
            --tally campfire-tally.txt \
            --fail-log /tmp/campfire-failures.txt \
            --json campfire-suite/summary.json \
            /tmp/campfire
      - name: Enforce the floor
        env:
          FLOOR_TESTS: 392
          FLOOR_FILES: 66
        run: |
          set -euo pipefail
          tests=$(awk -F'|' '{p += $3} END {print p+0}' campfire-tally.txt)
          total=$(awk -F'|' '{t += $4} END {print t+0}' campfire-tally.txt)
          files=$(grep -c '^PASS' campfire-tally.txt || true)
          echo "campfire conformance: $tests of $total tests, $files of $(grep -c . campfire-tally.txt) files green"
          echo "floor: $FLOOR_TESTS tests / $FLOOR_FILES files"
          rc=0
          if [ "$tests" -lt "$FLOOR_TESTS" ]; then
            echo "::error::campfire tests regressed: $tests < $FLOOR_TESTS (see the tally artifact for the first error per file)"
            rc=1
          fi
          if [ "$files" -lt "$FLOOR_FILES" ]; then
            echo "::error::campfire green files regressed: $files < $FLOOR_FILES"
            rc=1
          fi
          if [ "$tests" -gt "$FLOOR_TESTS" ] || [ "$files" -gt "$FLOOR_FILES" ]; then
            echo "::notice::floor is stale — raise FLOOR_TESTS/FLOOR_FILES to $tests/$files"
          fi
          exit $rc
      - name: Upload the tally
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campfire-conformance-tally
          path: campfire-tally.txt
          if-no-files-found: warn
      - name: Upload the conformance summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campfire-conformance-summary
          path: campfire-suite/summary.json
          if-no-files-found: warn

